name: Compilar APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Obtener código abierto de Whisper
        run: git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git app/src/main/cpp/whisper-src
      - name: Compilar APK de prueba
        run: gradle :app:assembleDebug --stacktrace
      - name: Verificar biblioteca nativa en APK
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libgrabador_whisper.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libwhisper.so'
      - uses: actions/upload-artifact@v4
        with:
          name: GrabadorUniversitario-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
